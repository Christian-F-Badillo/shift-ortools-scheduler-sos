services:
  - type: web
    name: sos-scheduler
    runtime: python
    plan: free
    branch: feat/sos-web-dashboard
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: uv run uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
