[project]
name = "scheduler-creator"
version = "0.1.0"
description = "FastAPI shift scheduler with an OR-Tools optimization engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.162.0",
    "openpyxl>=3.1.5",
    "ortools>=9.15.6755",
    "pydantic>=2.14.2",
    "sqlalchemy>=2.1.7",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=9.2.0"]
