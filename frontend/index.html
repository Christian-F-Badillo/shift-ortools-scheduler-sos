<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020"><title>SOS · Scheduler Operations</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#111a2d;--panel2:#172239;--line:#26344d;--muted:#91a0b8;--text:#e8eef8;--blue:#6d9eff;--cyan:#5ed6d0;--green:#52d6a0;--amber:#f4bd62;--red:#f17883;--purple:#ad91ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -15%,#1a2c4c 0,transparent 42%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:25px 16px;border-right:1px solid var(--line);background:#0c1425eF;display:flex;flex-direction:column;z-index:5}.brand{display:flex;align-items:center;gap:12px;padding:0 10px 30px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#6d9eff,#8c7bff);display:grid;place-items:center;color:#081225;font-weight:900;font-size:19px;box-shadow:0 8px 30px #647dff44}.brand strong{display:block;font-size:15px;letter-spacing:.03em}.brand small{color:var(--muted);font-size:11px}.nav-label{padding:14px 12px 8px;color:#697b98;font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#9eacc2;text-align:left;padding:11px 12px;border-radius:10px;display:flex;align-items:center;gap:12px;transition:.2s}.nav button:hover{background:#17243a;color:var(--text)}.nav button.active{background:linear-gradient(90deg,#24395b,#1a2941);color:#fff;box-shadow:inset 2px 0 var(--blue)}.nav .ico{width:18px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;padding:14px 10px 4px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:7px;box-shadow:0 0 10px #52d6a0}.main{min-width:0}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,54px);background:#0b1020aa;backdrop-filter:blur(14px);position:sticky;top:0;z-index:4}.crumb{color:var(--muted);font-size:12px}.top-right{display:flex;align-items:center;gap:12px}.api-state{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:7px 10px}.avatar{width:32px;height:32px;border-radius:50%;background:#263a5a;display:grid;place-items:center;font-size:11px;font-weight:700}.content{padding:34px clamp(20px,4vw,54px) 60px;max-width:1600px;margin:auto}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:26px}.eyebrow{color:var(--blue);font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;margin-bottom:7px}.page-head h1{font-size:27px;letter-spacing:-.04em;margin:0 0 5px}.page-head p{color:var(--muted);margin:0}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:9px;padding:9px 13px;font-weight:650;font-size:12px}.btn:hover{border-color:#5476a8;background:#1d2b45}.btn.primary{background:linear-gradient(135deg,#6d9eff,#8a80ff);border:0;color:#081225;box-shadow:0 6px 22px #6d9eff2b}.btn.danger{color:var(--red)}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:17px}.card{background:linear-gradient(145deg,#141f34,#10192b);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;box-shadow:0 8px 28px #00000012}.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:#243654;color:var(--blue);font-size:16px}.stat-value{font-size:29px;font-weight:750;letter-spacing:-.05em;margin:13px 0 2px}.stat-foot{font-size:11px;color:var(--muted)}.two-col{grid-template-columns:minmax(0,1.45fr) minmax(290px,.85fr)}.card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.card-title h3{font-size:13px;margin:0;font-weight:700}.card-title span{font-size:11px;color:var(--muted)}.bars{height:178px;display:flex;align-items:end;gap:clamp(8px,2vw,22px);padding:10px 4px 0;border-bottom:1px solid var(--line)}.bar-group{height:100%;flex:1;display:flex;align-items:center;justify-content:end;flex-direction:column;gap:8px;min-width:0}.bar-pair{height:145px;width:100%;display:flex;align-items:end;justify-content:center;gap:5px}.bar{width:min(24px,38%);border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,#7aa8ff,#456bc0);min-height:3px}.bar.alt{background:linear-gradient(180deg,#5ed6d0,#278e99)}.bar-label{font-size:10px;color:var(--muted)}.legend{display:flex;gap:16px;margin-top:15px;color:var(--muted);font-size:10px}.legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;background:var(--blue)}.legend .teal{background:var(--cyan)}.run-list{display:grid;gap:0}.run-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #202e45}.run-row:last-child{border:0}.run-badge{width:34px;height:34px;border-radius:10px;background:#20324d;display:grid;place-items:center;color:var(--blue)}.run-info{min-width:0;flex:1}.run-info strong{display:block;font-size:12px}.run-info small{color:var(--muted);font-size:10px}.pill{font-size:10px;font-weight:750;padding:4px 8px;border-radius:20px;background:#1d3b35;color:var(--green)}.pill.partial{background:#45371f;color:var(--amber)}.pill.none,.pill.failed{background:#482832;color:var(--red)}.pill.neutral{background:#24334b;color:#a9bad5}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th{text-align:left;color:#8292ac;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:750;padding:11px 12px;border-bottom:1px solid var(--line)}.table td{padding:13px 12px;border-bottom:1px solid #202d42;font-size:12px}.table tr:last-child td{border:0}.table tbody tr:hover{background:#ffffff05}.person{display:flex;align-items:center;gap:10px}.person-avatar{width:29px;height:29px;border-radius:9px;background:#293b5a;display:grid;place-items:center;font-size:10px;color:#b8ceff;font-weight:800}.muted{color:var(--muted)}.empty{padding:34px 15px;text-align:center;color:var(--muted);font-size:12px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.field{background:#0c1526;border:1px solid var(--line);color:var(--text);padding:9px 11px;border-radius:8px;outline:none;min-width:0}.field:focus{border-color:#668bd0}.field::placeholder{color:#62738f}.toolbar .field{font-size:12px}.week-grid{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));gap:8px;overflow:auto}.day-col{background:#0e1829;border:1px solid var(--line);border-radius:10px;min-height:190px;padding:10px}.day-col.today{border-color:#668bd0}.day-name{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:800}.day-date{font-size:13px;font-weight:750;margin:2px 0 12px}.shift-chip{font-size:10px;padding:7px;margin-bottom:6px;border-radius:7px;background:#213451;border-left:2px solid var(--blue)}.shift-chip.night{background:#302a4a;border-color:var(--purple)}.shift-chip small{display:block;color:#9aabc5;margin-top:3px}.modal-backdrop{position:fixed;inset:0;background:#030711b8;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal-backdrop.show{display:flex}.modal{width:min(460px,100%);background:#121d31;border:1px solid #34435d;border-radius:16px;padding:22px;box-shadow:0 24px 80px #0009}.modal h2{font-size:17px;margin:0 0 17px}.form-grid{display:grid;gap:12px}.form-grid label{font-size:11px;color:var(--muted);display:grid;gap:6px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.notice{border:1px solid #354968;background:#14243b;color:#b9cbea;padding:12px 14px;border-radius:10px;font-size:12px;margin-bottom:16px}.notice.error{border-color:#70404b;background:#321e29;color:#ffc1c8}.skeleton{height:12px;background:#26344a;border-radius:5px;animation:pulse 1.3s infinite alternate}@keyframes pulse{to{opacity:.4}}.hidden{display:none!important}.mobile-menu{display:none}
@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.app{grid-template-columns:215px minmax(0,1fr)}}
@media(max-width:720px){.app{display:block}.sidebar{position:fixed;left:-260px;width:248px;transition:left .2s;box-shadow:20px 0 60px #0007}.sidebar.open{left:0}.mobile-menu{display:inline-flex}.topbar{padding:0 16px}.content{padding:25px 16px 45px}.page-head{align-items:flex-start;flex-direction:column}.page-head h1{font-size:23px}.stats{gap:9px}.card{padding:14px}.stat-value{font-size:24px}.api-state{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="logo">S</div><div><strong>SOS Scheduler</strong><small>OPERATIONS CONSOLE</small></div></div>
 <div class="nav-label">Workspace</div><nav class="nav">
 <button class="active" data-page="overview"><span class="ico">◫</span> Overview</button>
 <button data-page="employees"><span class="ico">♙</span> Employees</button>
 <button data-page="catalogs"><span class="ico">◇</span> Roles & departments</button>
 <button data-page="availability"><span class="ico">▦</span> Availability</button>
 <button data-page="builder"><span class="ico">✳</span> Schedule builder</button>
 <button data-page="schedules"><span class="ico">▤</span> Schedules</button>
 <button data-page="runs"><span class="ico">⌁</span> Solver runs</button>
 <div class="nav-label">System</div>
 <button data-page="settings"><span class="ico">⚙</span> Configuration</button>
 </nav>
 <div class="side-bottom"><div><i class="status-dot"></i><span id="side-status">Connecting to API</span></div><div style="margin-top:8px">CP-SAT · FastAPI</div></div>
</aside>
<main class="main">
 <header class="topbar"><div class="top-right"><button class="btn mobile-menu" id="menuBtn">☰</button><div class="crumb">SOS <span class="muted">/</span> <span id="crumb">Overview</span></div></div><div class="top-right"><span class="api-state" id="api-state">● Checking API</span><div class="avatar">SOS</div></div></header>
 <section class="content" id="content"><div class="empty">Loading workspace…</div></section>
</main>
</div>
<div class="modal-backdrop" id="modal"><div class="modal"><h2 id="modal-title">New employee</h2><form id="modal-form"><div id="modal-fields" class="form-grid"></div><div class="modal-actions"><button type="button" class="btn" id="modal-cancel">Cancel</button><button class="btn primary" type="submit">Save changes</button></div></form></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={page:"overview",employees:[],roles:[],areas:[],shifts:[],runs:[],constraints:[],runId:null,assignments:[],week:monday(new Date()),availabilityEmployee:null};
function monday(d){const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
function iso(d){return d.toISOString().slice(0,10)}
function fmt(d){return new Intl.DateTimeFormat("es-MX",{day:"2-digit",month:"short"}).format(d)}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function initials(s){return (s||"?").split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()}
function pill(v){let c=v==="full"||v==="done"?"":v==="partial"?"partial":v==="none"||v==="failed"?"none":"neutral";return '<span class="pill '+c+'">'+esc(v||"pending")+'</span>'}
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})}});if(!r.ok){let msg;try{const x=await r.json();msg=x.detail?.message||x.detail||JSON.stringify(x)}catch{msg=r.statusText}throw Error(typeof msg==="string"?msg:JSON.stringify(msg))}if(r.status===204)return null;const ct=r.headers.get("content-type")||"";return ct.includes("json")?r.json():r.blob()}
async function loadBase(){const results=await Promise.allSettled([api("/employees"),api("/roles"),api("/areas"),api("/shifts"),api("/runs?limit=8"),api("/config/constraints")]);[state.employees,state.roles,state.areas,state.shifts,state.runs,state.constraints]=results.map((r)=>r.status==="fulfilled"?r.value:[]);const failed=results.some(r=>r.status==="rejected");$("#api-state").textContent=failed?"● API partial":"● API connected";$("#api-state").style.color=failed?"var(--amber)":"var(--green)";$("#side-status").textContent=failed?"Partial connection":"API connected"}
function heading(kicker,title,desc,actions=""){return '<div class="page-head"><div><div class="eyebrow">'+kicker+'</div><h1>'+title+'</h1><p>'+desc+'</p></div><div class="actions">'+actions+'</div></div>'}
function stat(label,value,foot,icon){return '<div class="card"><div class="stat-top"><span>'+label+'</span><span class="stat-icon">'+icon+'</span></div><div class="stat-value">'+value+'</div><div class="stat-foot">'+foot+'</div></div>'}
function runRows(runs){if(!runs.length)return '<div class="empty">No hay ejecuciones todavía. Genera tu primer horario.</div>';return '<div class="run-list">'+runs.map(r=>'<div class="run-row"><div class="run-badge">⌁</div><div class="run-info"><strong>Run #'+r.id+' · '+esc(r.week_start_date)+'</strong><small>'+esc(r.created_at||"")+' · '+(r.solve_time_ms??"—")+' ms</small></div>'+pill(r.feasibility||r.status)+'</div>').join("")+'</div>'}
function renderOverview(){const active=state.employees.filter(e=>e.active).length,latest=state.runs[0],avg=state.runs.length?Math.round(state.runs.reduce((a,r)=>a+(r.solve_time_ms||0),0)/state.runs.length):0;const action='<button class="btn" data-go="employees">Manage team ↗</button><button class="btn primary" data-go="builder">＋ Generate schedule</button>';return heading("OPERATIONS / OVERVIEW","Good morning, scheduler.","Your workforce planning at a glance.",action)+'<div class="grid stats">'+stat("Active employees",active,"Across all roles and areas","♙")+stat("Available shifts",state.shifts.length,"Configured shift templates","◷")+stat("Solver executions",state.runs.length,"Recent runs in history","⌁")+stat("Average solve time",avg?avg+" ms":"—","Across loaded executions","ϟ")+'</div><div class="grid two-col"><div class="card"><div class="card-title"><h3>Workforce distribution</h3><span>Employees by role</span></div>'+roleChart()+'</div><div class="card"><div class="card-title"><h3>Latest solver activity</h3><span>Recent executions</span></div>'+runRows(state.runs.slice(0,5))+'</div></div><div class="card" style="margin-top:15px"><div class="card-title"><h3>Team directory</h3><button class="btn" data-go="employees">View all ↗</button></div>'+employeeTable(state.employees.slice(0,5))+'</div>'}
function roleChart(){if(!state.employees.length)return '<div class="empty">Add employees to see workforce distribution.</div>';const counts=state.roles.map(r=>({name:r.name,n:state.employees.filter(e=>e.active&&e.role_id===r.id).length})).filter(x=>x.n);const max=Math.max(1,...counts.map(x=>x.n));return '<div class="bars">'+counts.map(x=>'<div class="bar-group"><div class="bar-pair"><div class="bar" style="height:'+Math.max(4,x.n/max*100)+'%"></div></div><div class="bar-label">'+esc(x.name)+'</div></div>').join("")+'</div><div class="legend"><span><i></i> Active employees</span></div>'}
function employeeTable(items){if(!items.length)return '<div class="empty">No employees found.</div>';return '<div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Role</th><th>Area</th><th>Status</th><th></th></tr></thead><tbody>'+items.map(e=>'<tr><td><div class="person"><span class="person-avatar">'+initials(e.name)+'</span><strong>'+esc(e.name)+'</strong></div></td><td>'+esc(state.roles.find(x=>x.id===e.role_id)?.name||"—")+'</td><td>'+esc(state.areas.find(x=>x.id===e.area_id)?.name||"—")+'</td><td>'+(e.active?'<span class="pill">Active</span>':'<span class="pill neutral">Inactive</span>')+'</td><td><button class="btn" data-edit="'+e.id+'">Edit</button></td></tr>').join("")+'</tbody></table></div>'}
function renderCatalogs(){return heading("WORKFORCE / CATALOGS","Roles & departments","Create and maintain the catalogs required to register employees.")+'<div class="grid two-col"><div class="card"><div class="card-title"><h3>Roles</h3><span>'+state.roles.length+' configured</span></div><form id="roleForm" class="toolbar"><input class="field" name="name" placeholder="e.g. Supervisor" required maxlength="100" style="flex:1"><button class="btn primary" type="submit">＋ Add role</button></form>'+(state.roles.length?'<div class="run-list">'+state.roles.map(r=>'<div class="run-row"><div class="run-info"><strong>'+esc(r.name)+'</strong><small>ID #'+r.id+'</small></div></div>').join('')+'</div>':'<div class="empty">No roles yet. Create a role to enable employee registration.</div>')+'</div><div class="card"><div class="card-title"><h3>Departments / areas</h3><span>'+state.areas.length+' configured</span></div><form id="areaForm" class="toolbar"><input class="field" name="name" placeholder="e.g. Operations" required maxlength="100" style="flex:1"><button class="btn primary" type="submit">＋ Add department</button></form>'+(state.areas.length?'<div class="run-list">'+state.areas.map(a=>'<div class="run-row"><div class="run-info"><strong>'+esc(a.name)+'</strong><small>ID #'+a.id+'</small></div></div>').join('')+'</div>':'<div class="empty">No departments yet. Employees can optionally be assigned to an area.</div>')+'</div></div>'}
function renderEmployees(){return heading("WORKFORCE / DIRECTORY","Employees","Manage your team, roles and work areas.",'<button class="btn primary" id="addEmployee">＋ Add employee</button>')+'<div class="card"><div class="toolbar"><input class="field" id="employeeSearch" placeholder="Search employees…" style="flex:1;max-width:320px"><select class="field" id="employeeFilter"><option value="active">Active employees</option><option value="all">All employees</option></select><span class="muted" id="employeeCount">'+state.employees.filter(e=>e.active).length+' active</span></div><div id="employeeTable">'+employeeTable(state.employees.filter(e=>e.active))+'</div></div>'}
function renderBuilder(){const w=state.week;return heading("PLANNING / OPTIMIZATION","Schedule builder","Choose a Monday and run the CP-SAT optimizer.",'<button class="btn primary" id="solveBtn">ϟ Generate schedule</button>')+'<div class="notice">The solver uses your configured employee availability, shift requirements and soft-constraint weights. Hard infeasibility is reported with a diagnostic.</div><div class="card"><div class="toolbar"><label class="muted">Week starting</label><input type="date" class="field" id="weekPicker" value="'+iso(w)+'"><button class="btn" id="loadRequirements">Load requirements</button></div><div id="requirements"><div class="empty">Select a week and load its requirements.</div></div></div><div id="solveResult" style="margin-top:15px"></div>'}
async function loadRequirements(){const d=$("#weekPicker").value;if(!d)return;const date=new Date(d+"T12:00:00");if(date.getDay()!==1){toast("Choose a Monday to configure a schedule.");return}state.week=date;try{const r=await api("/requirements?week_start="+d);const days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];const sr=r.shift_requirements||[];$("#requirements").innerHTML='<div class="table-wrap"><table class="table"><thead><tr><th>Shift</th>'+days.map(x=>'<th>'+x+'</th>').join("")+'</tr></thead><tbody>'+state.shifts.map(s=>'<tr><td><strong>'+esc(s.name)+'</strong><div class="muted">'+esc(s.start_time)+' · '+s.duration_hours+'h</div></td>'+days.map((_,i)=>{const x=sr.find(q=>q.shift_id===s.id&&q.day_of_week===i);return '<td>'+(x?x.min_staff+' min':'<span class="muted">Not set</span>')+'</td>'}).join("")+'</tr>').join("")+'</tbody></table></div><p class="muted" style="font-size:11px;margin:14px 0 0">'+sr.length+' shift requirements · '+(r.role_requirements||[]).length+' role/area requirements. Configure requirements through API for now.</p>'}catch(e){$("#requirements").innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}
async function solve(){const d=$("#weekPicker")?.value||iso(state.week);if(new Date(d+"T12:00:00").getDay()!==1){toast("Week start must be a Monday.");return}const b=$("#solveBtn");b.disabled=true;b.textContent="Solving…";try{const r=await api("/runs",{method:"POST",body:JSON.stringify({week_start:d})});$("#solveResult").innerHTML='<div class="card"><div class="card-title"><h3>Run #'+r.run_id+' completed</h3>'+pill(r.feasibility)+'</div><div class="grid stats">'+stat("Assignments",r.assignments_count,"Generated assignments","▤")+stat("Solve time",r.solve_time_ms+" ms","CP-SAT execution","ϟ")+stat("Relaxed constraints",r.relaxed_constraints.length,"Soft constraints relaxed","⚑")+stat("Week",d,"Monday start","▦")+'</div>'+(r.diagnostic?'<p class="muted">'+esc(r.diagnostic)+'</p>':"")+(r.relaxed_constraints.length?'<h4>Relaxed constraints</h4>'+r.relaxed_constraints.map(x=>'<p class="muted">• '+esc(x.description)+' — '+esc(x.affected.join(", "))+'</p>').join(""):"")+'<button class="btn primary" data-open-run="'+r.run_id+'">View generated schedule →</button></div>';await loadBase()}catch(e){$("#solveResult").innerHTML='<div class="notice error">Solver error: '+esc(e.message)+'</div>'}finally{b.disabled=false;b.textContent="ϟ Generate schedule"}}
async function renderSchedules(){const runs=await api("/runs?limit=50");state.runs=runs;const chosen=state.runId||runs[0]?.id;if(!chosen)return heading("PLANNING / SCHEDULES","Schedules","Generated weekly schedules.")+'<div class="card empty">No schedules yet. Run the optimizer first.</div>';state.runId=chosen;const run=await api("/runs/"+chosen);const [as,emps,shifts]=await Promise.all([api("/runs/"+chosen+"/assignments"),api("/employees?include_inactive=true"),api("/shifts")]);state.assignments=as;const start=new Date(run.week_start_date+"T12:00:00");const dayNames=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];const days=dayNames.map((name,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);const list=as.filter(a=>a.date===iso(d));return '<div class="day-col"><div class="day-name">'+name+'</div><div class="day-date">'+fmt(d)+'</div>'+list.map(a=>{const e=emps.find(x=>x.id===a.employee_id),s=shifts.find(x=>x.id===a.shift_id);return '<div class="shift-chip '+(/night/i.test(s?.name||"")?"night":"")+'">'+esc(e?.name||"Employee #"+a.employee_id)+'<small>'+esc(s?.name||"Shift")+(a.is_override?" · edited":"")+'</small></div>'}).join("")+'</div>'}).join("");return heading("PLANNING / SCHEDULES","Schedule calendar","Inspect assignments and export a solver run.",'<button class="btn" id="exportCsv">↓ Export CSV</button><button class="btn" id="exportXlsx">↓ Export XLSX</button>')+'<div class="card"><div class="toolbar"><select class="field" id="runSelect">'+runs.map(r=>'<option value="'+r.id+'" '+(r.id===chosen?"selected":"")+'>Run #'+r.id+' · '+esc(r.week_start_date)+' · '+esc(r.feasibility||r.status)+'</option>').join("")+'</select><span class="muted">'+as.length+' assignments · '+(run.solve_time_ms??"—")+' ms</span>'+pill(run.feasibility||run.status)+'</div><div class="week-grid">'+days+'</div></div>'}
async function renderRuns(){return heading("OPTIMIZATION / EXPERIMENTS","Solver runs","Execution history, feasibility and solver diagnostics.")+'<div class="card"><div class="card-title"><h3>Execution history</h3><span>Latest 100 runs</span></div>'+runRows(await api("/runs?limit=100"))+'</div>'}
async function renderAvailability(){return heading("WORKFORCE / CALENDAR","Availability","Record leave, sick days and days off for an employee.")+'<div class="card"><div class="toolbar"><select class="field" id="availabilityEmployee"><option value="">Select employee</option>'+state.employees.map(e=>'<option value="'+e.id+'">'+esc(e.name)+'</option>').join("")+'</select><input type="date" class="field" id="availabilityDate" value="'+iso(new Date())+'"><select class="field" id="availabilityStatus"><option value="VACATION">Vacation</option><option value="SICK">Sick leave</option><option value="DAY_OFF">Day off</option><option value="AVAILABLE">Available</option></select><button class="btn primary" id="saveAvailability">Save availability</button></div><div id="availabilityRecords" class="empty">Select an employee to view their availability records.</div></div>'}
async function renderSettings(){const constraints=await api("/config/constraints");state.constraints=constraints;return heading("SYSTEM / CONFIGURATION","Solver configuration","Tune the objective function's soft-constraint weights and priorities.")+'<div class="notice">Higher weights make the solver avoid a soft-constraint violation more strongly. Priority is informational for the current relaxation policy.</div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Constraint</th><th>Description</th><th>Weight</th><th>Priority</th><th></th></tr></thead><tbody>'+constraints.map(c=>'<tr><td><strong>'+esc(c.id)+'</strong></td><td>'+esc(c.description)+'</td><td><input class="field" type="number" min="0" max="100000" value="'+c.weight+'" id="weight-'+esc(c.id)+'" style="width:90px"></td><td><input class="field" type="number" min="1" max="10" value="'+c.priority+'" id="priority-'+esc(c.id)+'" style="width:75px"></td><td><button class="btn" data-save-constraint="'+esc(c.id)+'">Save</button></td></tr>').join("")+'</tbody></table></div></div>'}
async function render(){const root=$("#content");try{let html=state.page==="overview"?renderOverview():state.page==="employees"?renderEmployees():state.page==="catalogs"?renderCatalogs():state.page==="builder"?renderBuilder():state.page==="availability"?await renderAvailability():state.page==="schedules"?await renderSchedules():state.page==="runs"?await renderRuns():await renderSettings();root.innerHTML=html;$("#crumb").textContent=({overview:"Overview",employees:"Employees",catalogs:"Roles & departments",availability:"Availability",builder:"Schedule builder",schedules:"Schedules",runs:"Solver runs",settings:"Configuration"})[state.page];bind()}catch(e){root.innerHTML='<div class="notice error">Could not load this section: '+esc(e.message)+'</div>'}}
function go(page){state.page=page;$$(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));$("#sidebar").classList.remove("open");render()}
function bind(){if($("#roleForm"))$("#roleForm").onsubmit=createCatalogItem.bind(null,"/roles");if($("#areaForm"))$("#areaForm").onsubmit=createCatalogItem.bind(null,"/areas"); $("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));if($("#addEmployee"))$("#addEmployee").onclick=()=>employeeModal();$$("[data-edit]").forEach(b=>b.onclick=()=>employeeModal(state.employees.find(e=>e.id==b.dataset.edit)));if($("#employeeSearch"))$("#employeeSearch").oninput=filterEmployees;if($("#employeeFilter"))$("#employeeFilter").onchange=filterEmployees;if($("#loadRequirements"))$("#loadRequirements").onclick=loadRequirements;if($("#solveBtn"))$("#solveBtn").onclick=solve;$$("[data-open-run]").forEach(b=>b.onclick=()=>{state.runId=+b.dataset.openRun;go("schedules")});if($("#runSelect"))$("#runSelect").onchange=()=>{state.runId=+$("#runSelect").value;render()};if($("#exportCsv"))$("#exportCsv").onclick=()=>download("/runs/"+state.runId+"/export?format=csv","schedule-"+state.runId+".csv");if($("#exportXlsx"))$("#exportXlsx").onclick=()=>download("/runs/"+state.runId+"/export?format=xlsx","schedule-"+state.runId+".xlsx");if($("#availabilityEmployee"))$("#availabilityEmployee").onchange=loadAvailability;if($("#saveAvailability"))$("#saveAvailability").onclick=saveAvailability;$$("[data-save-constraint]").forEach(b=>b.onclick=()=>saveConstraint(b.dataset.saveConstraint))}
function filterEmployees(){const q=$("#employeeSearch").value.toLowerCase(),all=$("#employeeFilter").value==="all";const rows=state.employees.filter(e=>(all||e.active)&&e.name.toLowerCase().includes(q));$("#employeeTable").innerHTML=employeeTable(rows);$("#employeeCount").textContent=rows.length+" employees";$$("[data-edit]").forEach(b=>b.onclick=()=>employeeModal(state.employees.find(e=>e.id==b.dataset.edit)))}
async function createCatalogItem(endpoint,event){event.preventDefault();const form=event.currentTarget,name=new FormData(form).get("name").trim();if(!name)return;try{await api(endpoint,{method:"POST",body:JSON.stringify({name})});await loadBase();render();toast(endpoint==="/roles"?"Role created.":"Department created.")}catch(e){toast(e.message,true)}}
function employeeModal(emp){if(!emp&&!state.roles.length){toast("Create at least one role before adding an employee.",true);go("catalogs");return}$("#modal-title").textContent=emp?"Edit employee":"Add employee";$("#modal-fields").innerHTML='<label>Full name<input class="field" name="name" required value="'+esc(emp?.name||"")+'"></label><label>Role<select class="field" name="role_id" required>'+state.roles.map(r=>'<option value="'+r.id+'" '+(r.id===emp?.role_id?"selected":"")+'>'+esc(r.name)+'</option>').join("")+'</select></label><label>Area<select class="field" name="area_id"><option value="">No area</option>'+state.areas.map(a=>'<option value="'+a.id+'" '+(a.id===emp?.area_id?"selected":"")+'>'+esc(a.name)+'</option>').join("")+'</select></label>'+(emp?'<label>Status<select class="field" name="active"><option value="true" '+(emp.active?"selected":"")+'>Active</option><option value="false" '+(!emp.active?"selected":"")+'>Inactive</option></select></label>':"");$("#modal").classList.add("show");$("#modal-form").onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target),body={name:f.get("name"),role_id:+f.get("role_id"),area_id:f.get("area_id")?+f.get("area_id"):null};if(emp)body.active=f.get("active")==="true";try{await api(emp?"/employees/"+emp.id:"/employees",{method:emp?"PATCH":"POST",body:JSON.stringify(body)});$("#modal").classList.remove("show");await loadBase();render();toast("Employee saved.")}catch(e){toast(e.message,true)}}}
async function loadAvailability(){const id=$("#availabilityEmployee").value;if(!id)return;try{const d=$("#availabilityDate").value||iso(new Date());const week=iso(monday(new Date(d+"T12:00:00")));const rows=await api("/employees/"+id+"/availability?week_start="+week);$("#availabilityRecords").innerHTML=rows.length?rows.map(r=>"<div class=run-row><div class=run-info><strong>"+esc(r.date)+"</strong><small>"+esc(r.status)+"</small></div></div>").join(""):"<div class=empty>No exceptions recorded for this week.</div>"}catch(e){$("#availabilityRecords").textContent="No record for this date yet."}}
async function saveAvailability(){const id=$("#availabilityEmployee").value,d=$("#availabilityDate").value,status=$("#availabilityStatus").value;if(!id||!d){toast("Select employee and date.",true);return}try{if(status==="AVAILABLE")await api("/employees/"+id+"/availability/"+d,{method:"DELETE"});else await api("/employees/"+id+"/availability/"+d,{method:"PUT",body:JSON.stringify({status})});toast("Availability updated.");loadAvailability()}catch(e){toast(e.message,true)}}
async function saveConstraint(id){try{await api("/config/constraints/"+id,{method:"PATCH",body:JSON.stringify({weight:+$("#weight-"+id).value,priority:+$("#priority-"+id).value})});toast("Constraint updated.")}catch(e){toast(e.message,true)}}
async function download(url,name){try{const b=await api(url);const a=document.createElement("a"),u=URL.createObjectURL(b);a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}catch(e){toast(e.message,true)}}
function toast(msg,error=false){let el=$("#toast");if(!el){el=document.createElement("div");el.id="toast";el.style.cssText="position:fixed;bottom:22px;right:22px;z-index:50;padding:12px 16px;border-radius:10px;background:#1b2b43;border:1px solid #3a5275;color:#e8eef8;box-shadow:0 12px 35px #0008;max-width:min(440px,90vw);font-size:12px";document.body.append(el)}el.style.borderColor=error?"#a95362":"#3a806c";el.textContent=msg;clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>el.remove(),3500)}
$("#modal-cancel").onclick=()=>$("#modal").classList.remove("show");$("#modal").onclick=e=>{if(e.target===$("#modal"))$("#modal").classList.remove("show")};$("#menuBtn").onclick=()=>$("#sidebar").classList.toggle("open");$$(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.page));
(async()=>{try{await loadBase();await render()}catch(e){$("#content").innerHTML='<div class="notice error">API unavailable: '+esc(e.message)+'</div>'}})();
</script>
</body></html>
